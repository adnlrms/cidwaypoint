<header class="bar">
  <div class="brand">
    <div class="logos" id="logos"></div>
    <div class="wordmark">
      <span class="wm-top">CID<span id="demoTag" class="demo-tag" hidden title="Sample data only. Paste your Apps Script URL into the cid-api meta tag to connect the real database.">DEMO</span></span><span class="wm-bot">WAYPOINT</span>

      <div id="unitName" class="muted">Personnel Whereabouts Board</div>
    </div>
  </div>
  <div class="dtg" title="Philippine Standard Time">
    <span id="sy" class="sy">S.Y. ————</span>
    <span id="dtg">———</span>
    <span class="sync" id="sync"><i></i><b>CONNECTING</b></span>
  </div>
  <div class="bar-actions">
    <button class="btn ghost" id="btnSearch" aria-label="Search (press /)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="hide-sm">Search</span><kbd class="hide-sm">/</kbd></button>

    <button class="btn key" id="btnAdmin" aria-label="Admin console"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-4 4 3 3m-6 0 2 2"/></svg><span class="hide-sm">Admin</span></button>
  </div>
</header>


<nav class="controls">
  <div class="seg" role="tablist" aria-label="View">
    <button role="tab" data-view="window" aria-selected="true">Week</button>
    <button role="tab" data-view="month">Month</button>
    <button role="tab" data-view="year">Year</button>
    <button role="tab" data-view="insights">Insights</button>
  </div>
  <div class="range">
    <button class="btn ghost icon" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="range-label" id="rangeLabel">—</div>
    <button class="btn ghost icon" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    <button class="btn ghost sm" id="today">Today</button>
  </div>
  <div class="filters">
    <div class="seg" id="layoutSeg" role="tablist" aria-label="Layout">
      <button role="tab" data-layout="tiles" aria-selected="true">Tiles</button>

      <div class="pop" id="filterPop" hidden>
        <div class="chips" id="statusChips">
          <button data-f="all" class="on">Everyone</button>

          <button data-f="leave">On leave</button>

  </div>

<div id="offBar" class="offbar" hidden></div>
<div id="alertBar" class="alertbar" role="status" hidden></div>

<main class="layout">
  <section id="board" class="board" aria-live="polite"></section>
  <aside class="rail" id="rail">
    <div class="rail-head"><h2>Upcoming</h2><span id="railCount"></span></div>
    <div id="upcoming"></div>
    <div class="legend" id="legend"></div>
  </aside>
</main>

<!-- Personnel drawer -->
<div class="scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Personnel detail" hidden></aside>

<div class="overlay" id="searchOv" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
    <div class="pal-in">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>

      <button class="btn ghost sm" data-close>Esc</button>
    </div>
    <div class="pal-res" id="qres"></div>
    <div class="pal-foot muted mono" id="qfoot">↑↓ move · Enter open · searches loaded weeks instantly, then all records</div>
  </div>
</div>

<!-- Generic modal -->
<div class="overlay" id="modalOv" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<!-- Admin console -->
<div class="console" id="console" hidden role="dialog" aria-modal="true" aria-label="Admin console">
  <div class="con-bar">
    <div class="con-title"><span class="stencil">ADMIN</span> <span class="muted">console</span></div>

      <button data-tab="areas">Coverage areas</button>
      <button data-tab="branding">Branding</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <button class="btn ghost" id="conClose">Close</button>
  </div>
  <div class="con-body" id="conBody"></div>
</div>
